<svg xmlns="http://www.w3.org/2000/svg" width="566.4" height="475.2" viewBox="0 0 118 99" role="img" aria-labelledby="title desc">
  <title id="title">Low poly teal bird</title>
  <desc id="desc">An angular bird in flight, built from connected teal facets with swept wings and a long pointed tail.</desc>
  <!-- Solid backing prevents hairline gaps when shared edges are rasterized. -->
  <path fill="#00877e" d="M50 19 59 23 59 20 65 24 71 31 69 43 69 51 59 43Z M15 39 57 44 69 51 51 55 26 49Z M26 52 51 55 69 51 59 57 39 61Z M69 51 72 37 77 34 85 36 80 40 84 50 75 62 66 64 38 78 59 57Z"/>
  <g stroke="none">
    <!-- Raised wing: every adjoining facet shares the same endpoints. -->
    <polygon fill="#00877e" points="50,19 59,23 59,43"/>
    <polygon fill="#159b91" points="59,23 59,20 65,24"/>
    <polygon fill="#159b91" points="59,23 65,24 65,48"/>
    <polygon fill="#26a99b" points="59,23 65,48 59,43"/>
    <polygon fill="#08766f" points="65,24 71,31 69,43"/>
    <polygon fill="#0d8d83" points="65,24 69,43 65,48"/>
    <polygon fill="#00877e" points="59,43 65,48 69,51"/>
    <polygon fill="#08766f" points="65,48 69,43 69,51"/>
    <!-- Swept wing and lower feathers. -->
    <polygon fill="#00877e" points="15,39 57,44 26,49"/>
    <polygon fill="#0b9489" points="57,44 69,51 26,49"/>
    <polygon fill="#13988d" points="26,49 69,51 51,55"/>
    <polygon fill="#007d74" points="26,52 51,55 39,61"/>
    <polygon fill="#14988e" points="51,55 69,51 59,57"/>
    <polygon fill="#0a887e" points="51,55 59,57 39,61"/>
    <!-- Head and shoulder meet the body at a single shared edge. -->
    <polygon fill="#00877e" points="69,51 72,37 77,34 85,36 80,40 84,50"/>
    <polygon fill="#1a9c90" points="72,37 75,43 69,51"/>
    <polygon fill="#08776f" points="69,51 84,50 75,62"/>
    <polygon fill="#08776f" points="69,51 75,62 66,64"/>
    <polygon fill="#0b8278" points="69,51 66,64 59,57"/>
    <!-- Tail facets share a ridge contained entirely within the tail. -->
    <polygon fill="#0d9a8c" points="59,57 62.5,60.5 38,78"/>
    <polygon fill="#00877e" points="62.5,60.5 66,64 38,78"/>
  </g>
</svg>
